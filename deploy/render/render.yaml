services:
  - type: web
    name: sloth_graphmind-knowledge-explorer
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://sloth_graphmind-knowledge-explorer.onrender.com
      - key: FALKORDB_HOST
        fromService:
          type: keyvalue
          name: sloth_graphmind-explorer-redis
          property: host
      - key: FALKORDB_PORT
        fromService:
          type: keyvalue
          name: sloth_graphmind-explorer-redis
          property: port
      - key: SEMANTICA_API_KEY
        generateValue: true

  - type: keyvalue
    name: sloth_graphmind-explorer-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: snapshot
